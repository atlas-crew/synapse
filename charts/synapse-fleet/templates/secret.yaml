{{- $managedSecretName := include "synapse-fleet.managedSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $managedSecretName -}}
{{- if and .Values.enabled .Values.secrets.create (not (or .Values.database.url .Values.database.existingSecret .Values.secrets.existingSecret)) }}
{{- fail "synapse-fleet secrets.create=true requires database.url, database.existingSecret, or secrets.existingSecret" }}
{{- end }}
{{- if and .Values.enabled (not .Values.secrets.existingSecret) (or .Values.secrets.create .Values.database.url .Values.redis.url .Values.clickhouse.password $existing) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $managedSecretName }}
  labels:
    {{- include "synapse-fleet.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.global.commonAnnotations }}
  annotations:
    {{- with .Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  {{- $dbKey := .Values.secrets.keys.databaseUrl -}}
  {{- if .Values.database.url }}
  {{ $dbKey }}: {{ .Values.database.url | quote }}
  {{- else if and $existing (hasKey $existing.data $dbKey) }}
  {{ $dbKey }}: {{ index $existing.data $dbKey | b64dec | quote }}
  {{- end }}
  {{- $redisKey := .Values.secrets.keys.redisUrl -}}
  {{- if .Values.redis.url }}
  {{ $redisKey }}: {{ .Values.redis.url | quote }}
  {{- else if and $existing (hasKey $existing.data $redisKey) }}
  {{ $redisKey }}: {{ index $existing.data $redisKey | b64dec | quote }}
  {{- end }}
  {{- $clickhouseKey := .Values.secrets.keys.clickhousePassword -}}
  {{- if .Values.clickhouse.password }}
  {{ $clickhouseKey }}: {{ .Values.clickhouse.password | quote }}
  {{- else if and $existing (hasKey $existing.data $clickhouseKey) }}
  {{ $clickhouseKey }}: {{ index $existing.data $clickhouseKey | b64dec | quote }}
  {{- end }}
  {{- $jwtKey := .Values.secrets.keys.jwtSecret -}}
  {{- if or .Values.secrets.create (and $existing (hasKey $existing.data $jwtKey)) }}
  {{ $jwtKey }}: {{ if and $existing (hasKey $existing.data $jwtKey) }}{{ index $existing.data $jwtKey | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
  {{- end }}
  {{- $telemetryKey := .Values.secrets.keys.telemetryJwtSecret -}}
  {{- if or .Values.secrets.create (and $existing (hasKey $existing.data $telemetryKey)) }}
  {{ $telemetryKey }}: {{ if and $existing (hasKey $existing.data $telemetryKey) }}{{ index $existing.data $telemetryKey | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
  {{- end }}
  {{- $configKey := .Values.secrets.keys.configEncryptionKey -}}
  {{- if or .Values.secrets.create (and $existing (hasKey $existing.data $configKey)) }}
  {{ $configKey }}: {{ if and $existing (hasKey $existing.data $configKey) }}{{ index $existing.data $configKey | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
  {{- end }}
  {{- $metricsKey := .Values.secrets.keys.metricsAuthToken -}}
  {{- if or .Values.secrets.create (and $existing (hasKey $existing.data $metricsKey)) }}
  {{ $metricsKey }}: {{ if and $existing (hasKey $existing.data $metricsKey) }}{{ index $existing.data $metricsKey | b64dec | quote }}{{ else }}{{ randAlphaNum 48 | quote }}{{ end }}
  {{- end }}
{{- end }}
