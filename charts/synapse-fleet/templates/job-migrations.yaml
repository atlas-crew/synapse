{{- if and .Values.enabled .Values.migrations.enabled }}
{{- $jobName := printf "%s-migrations-%d" (include "synapse-fleet.fullname" .) .Release.Revision -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ if .Values.migrations.hook.enabled }}{{ printf "%s-migrations" (include "synapse-fleet.fullname" .) }}{{ else }}{{ $jobName }}{{ end }}
  labels:
    {{- include "synapse-fleet.baseLabels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: migrations
  {{- if or .Values.global.commonAnnotations .Values.migrations.hook.enabled }}
  annotations:
    {{- with .Values.global.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.migrations.hook.enabled }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: {{ .Values.migrations.hook.deletePolicy | quote }}
    helm.sh/hook-weight: "-5"
    {{- end }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  {{- with .Values.migrations.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "synapse-fleet.baseLabels" . | nindent 8 }}
        {{- with .Values.global.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "synapse-fleet.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "synapse-fleet.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          env:
            - name: DATABASE_URL
              {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | quote }}
                  key: {{ default "DATABASE_URL" .Values.database.existingSecretKey | quote }}
              {{- else if .Values.secrets.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.keys.databaseUrl | quote }}
              {{- else if .Values.database.url }}
              {{- if .Values.migrations.hook.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse-fleet.migrationsSecretName" . | quote }}
                  key: DATABASE_URL
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "synapse-fleet.managedSecretName" . | quote }}
                  key: {{ .Values.secrets.keys.databaseUrl | quote }}
              {{- end }}
              {{- else }}
              {{- fail "synapse-fleet migrations require database.url, database.existingSecret, or secrets.existingSecret" }}
              {{- end }}
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.writableTmp.enabled }}
          volumeMounts:
            - name: tmp
              mountPath: {{ .Values.writableTmp.mountPath }}
          {{- end }}
      {{- if .Values.writableTmp.enabled }}
      volumes:
        - name: tmp
          emptyDir:
            {{- if .Values.writableTmp.sizeLimit }}
            sizeLimit: {{ .Values.writableTmp.sizeLimit | quote }}
            {{- end }}
      {{- end }}
{{- end }}
