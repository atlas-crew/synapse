{{- $uiSecretName := include "synapse-fleet.uiSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $uiSecretName -}}
{{- if and .Values.enabled (not .Values.ui.apiKey.existingSecret) (or .Values.ui.apiKey.value (and .Values.ui.enabled .Values.secrets.create) $existing) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $uiSecretName }}
  labels:
    {{- include "synapse-fleet.labels" . | nindent 4 }}
    {{- with .Values.global.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app.kubernetes.io/component: ui
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- $primaryKey := .Values.secrets.keys.uiApiKey -}}
  {{- $primaryValue := "" -}}
  {{- if .Values.ui.apiKey.value }}
  {{- $primaryValue = .Values.ui.apiKey.value -}}
  {{- else if and $existing (hasKey $existing.data $primaryKey) }}
  {{- $primaryValue = index $existing.data $primaryKey | b64dec -}}
  {{- else if and $existing (hasKey $existing.data "VITE_API_KEY") }}
  {{- $primaryValue = index $existing.data "VITE_API_KEY" | b64dec -}}
  {{- else if and .Values.ui.enabled .Values.secrets.create }}
  {{- $primaryValue = randAlphaNum 32 -}}
  {{- end }}
  {{- if $primaryValue }}
  {{ $primaryKey }}: {{ $primaryValue | quote }}
  VITE_API_KEY: {{ $primaryValue | quote }}
  {{- end }}
{{- end }}
